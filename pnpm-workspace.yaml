allowBuilds:
  esbuild: true

# Force patched esbuild (>= 0.28.1) to close GHSA-gv7w-rqvm-qjhr
# esbuild is a transitive devDependency pulled in by Vite; pinning it here
# overrides every consumer regardless of the version Vite requested.
#
# postcss >= 8.5.18 closes GHSA-r28c-9q8g-f849: parsing CSS that carries a
# sourceMappingURL comment made PostCSS read that path off disk as a previous
# source map, so crafted CSS could disclose arbitrary .map files. Also a
# transitive devDependency of Vite.
#
# brace-expansion >= 5.0.8 closes GHSA-mh99-v99m-4gvg: unbounded brace
# expansion could exhaust memory and crash the process. The advisory has no
# backport, so the 2.x copy that workbox-build pulls in through
# minimatch/filelist/jake is vulnerable and only a major bump clears it.
# 5.x publishes a CommonJS entry alongside ESM, so the CJS consumers in that
# chain still resolve; verified by a full build, which is what exercises them.
overrides:
  esbuild: ^0.28.1
  postcss: ^8.5.18
  brace-expansion: ^5.0.8
